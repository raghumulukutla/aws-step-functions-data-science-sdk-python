process_csv_data = "staging-process-csv-function"
process_json_data = "staging-process-json-function"
aggregate_data = "staging-aggregate-function"
process_notification = "staging-notification-function"
send_slack_notification = "staging-slack-function"

# DynamoDB tables for staging
[staging.dynamodb.tables]
